upstream backend {
    server backend:8000;
}

# Production'da TLS host nginx'da tugatiladi va bu konteynerga oddiy HTTP
# keladi — ya'ni bu yerda $scheme har doim "http". Agar uni to'g'ridan-to'g'ri
# uzatsak, tashqi proxy yuborgan to'g'ri "https" qiymatini o'chirib yuboramiz
# va Django rasm URL'larini http:// bilan yasab, mixed content'ga olib keladi.
# Shuning uchun kelgan qiymatni saqlaymiz, bo'lmasa $scheme'ga qaytamiz
# (to'g'ridan-to'g'ri murojaat va lokal docker-compose uchun).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    # Host nginx bu konteynerga proxy so'rovini HTTP/1.0 bilan yuboradi
    # (proxy_http_version standarti). gzip_http_version standarti 1.1 bo'lgani
    # uchun hech narsa siqilmasdi — 530 KB JS siqilmasdan ketardi.
    gzip_http_version 1.0;
    gzip_proxied any;

    # Security headers
    # Diqqat: location ichida add_header yozilsa, bu yerdagilar o'sha
    # location'ga meros o'tmaydi — shuning uchun ular quyida ham takrorlanadi.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;

    # Vite build fayllari: nomida kontent hash bor, o'zgarsa nomi ham o'zgaradi
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Frontend (React SPA). index.html har safar tekshiriladi — aks holda
    # deploy'dan keyin brauzer eski bundle'ni ochaverardi.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Static files (Django)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Avtomatik yasalgan WebP thumbnail'lar — nomi asl fayl nomidan,
    # asl fayl almashsa Django yangi nom beradi
    location /media/thumbs/ {
        alias /app/media/thumbs/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
